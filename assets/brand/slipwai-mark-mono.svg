<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="currentColor" role="img" aria-label="slipwai">
  <title>slipwai</title>
  <!-- One colour first. The porthole and the funnel's band are knocked out rather than painted a second
       colour, so the mark holds at a favicon, on a stamp, and anywhere `currentColor` is the only colour
       there is. The spark is its own group so a page that has a second colour can give it one; it needs
       none. The mask id is long on purpose: this gets inlined more than once on a page. -->
  <defs>
    <mask id="slipwai-mark-knockout">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="11.5" cy="14.85" r="1.7" fill="#000"/>
      <rect x="17.6" y="12.4" width="4.6" height="1.7" fill="#000"/>
    </mask>
  </defs>
  <g class="spark">
  <path d="M24 1.4 l1.15 2.6 2.6 1.15 -2.6 1.15 -1.15 2.6 -1.15 -2.6 -2.6 -1.15 2.6 -1.15z"/>
  <circle cx="21.5" cy="7.9" r="1.05" opacity=".55"/>
  <circle cx="20.1" cy="9.9" r=".65" opacity=".32"/>
  </g>
  <g mask="url(#slipwai-mark-knockout)">
    <rect x="17.6" y="10.6" width="4.6" height="7" rx="1.3"/>
    <rect x="6.6" y="12.1" width="9.8" height="5.5" rx="1.9"/>
  </g>
  <path d="M2.2 17.6h24.3l3.1-1.5a1.05 1.05 0 0 1 1.47 1.18l-.97 4.2A4.1 4.1 0 0 1 26.07 24.6H8a4.1 4.1 0 0 1-4-3.12z"/>
  <path d="M2.6 27.6q2.7-1.7 5.4 0t5.4 0 5.4 0 5.4 0" fill="none" stroke="currentColor" stroke-width="1.9"
        stroke-linecap="round" opacity=".4"/>
</svg>
