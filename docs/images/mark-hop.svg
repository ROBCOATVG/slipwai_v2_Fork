<svg viewBox="0 0 1400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How a mark set in one fairway clears a slice in another through the harbour log, without waiting for a merge">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
<marker id="ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahhl"/></marker>
</defs>
<style>
svg{color:#172129;font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.box{fill:#fff;stroke:#73828c;stroke-width:1}.box.hl{fill:#dcecea;stroke:#0f6b6b;stroke-width:1.5}.box.dash{stroke-dasharray:4 3;fill:#f4f6f7}
.band{fill:#eef2f4;stroke:#d7dee2}.bandt{fill:#73828c;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;letter-spacing:.04em}
.bar{fill:#f1e9d2;stroke:#8a6d24}.trunk{fill:#dcecea;stroke:#0f6b6b;stroke-width:1.2}
text{fill:#172129}.lbl{fill:#44525c}.arr{stroke:#172129;stroke-width:1.2;fill:none}.arr.hl{stroke:#0f6b6b;stroke-width:1.6}.arr.dash{stroke-dasharray:4 3}
#ah path{fill:#172129}.ahhl{fill:#0f6b6b}
</style>
<rect class="band" x="16" y="16" width="640" height="288" rx="4"/><text class="bandt" x="28" y="33" font-size="11">FAIRWAY · Ordering</text>
<rect class="box " x="30" y="64" width="180" height="64" rx="3"/>
<text x="120.0" y="84.2" text-anchor="middle" font-size="12" font-weight="600">Slice A3 (planned)</text>
<text x="120.0" y="100.2" text-anchor="middle" font-size="12">sets OrderPlaced</text>
<text x="120.0" y="116.2" text-anchor="middle" font-size="12">attributes typed</text>
<rect class="box " x="30" y="212" width="180" height="64" rx="3"/>
<text x="120.0" y="232.2" text-anchor="middle" font-size="12" font-weight="600">Captain A</text>
<text x="120.0" y="248.2" text-anchor="middle" font-size="12">appends mark-set</text>
<text x="120.0" y="264.2" text-anchor="middle" font-size="12">to its own deck log</text>
<path class="arr " d="M 120,128 L 120,212" marker-end="url(#ah)"/>
<text class="lbl" x="128" y="164.0" text-anchor="start" font-size="11">its first stage</text>
<rect class="box " x="260" y="64" width="200" height="64" rx="3"/>
<text x="360.0" y="84.2" text-anchor="middle" font-size="12" font-weight="600">one file per event</text>
<text x="360.0" y="100.2" text-anchor="middle" font-size="12">(standard: contracts/)</text>
<text x="360.0" y="116.2" text-anchor="middle" font-size="12">set, never moved</text>
<path class="arr " d="M 210,96 L 260,96" marker-end="url(#ah)"/>
<text class="lbl" x="235.0" y="90.0" text-anchor="middle" font-size="11">adds</text>
<rect class="box hl" x="520" y="120" width="360" height="90" rx="3"/>
<text x="700.0" y="145.2" text-anchor="middle" font-size="12" font-weight="600">Harbour log</text>
<text x="700.0" y="161.2" text-anchor="middle" font-size="12">mark-set OrderPlaced</text>
<text x="700.0" y="177.2" text-anchor="middle" font-size="12">set by A3 · schema v1 · commit</text>
<text x="700.0" y="193.2" text-anchor="middle" font-size="12">merged A3 (later)</text>
<path class="arr hl " d="M 210,244 L 480,244 L 480,165 L 520,165" marker-end="url(#ah-hl)"/>
<text class="lbl" x="340" y="238" text-anchor="middle" font-size="11">harbourmaster copies it across</text>
<rect class="band" x="744" y="16" width="640" height="288" rx="4"/><text class="bandt" x="756" y="33" font-size="11">FAIRWAY · Billing</text>
<rect class="box " x="760" y="212" width="180" height="64" rx="3"/>
<text x="850.0" y="232.2" text-anchor="middle" font-size="12" font-weight="600">Captain B</text>
<text x="850.0" y="248.2" text-anchor="middle" font-size="12">re-derives clearance</text>
<text x="850.0" y="264.2" text-anchor="middle" font-size="12">at next boundary</text>
<path class="arr hl " d="M 880,165 L 920,165 L 920,212" marker-end="url(#ah-hl)"/>
<text class="lbl" x="928" y="190" text-anchor="start" font-size="11">reads</text>
<rect class="box " x="990" y="64" width="200" height="64" rx="3"/>
<text x="1090.0" y="84.2" text-anchor="middle" font-size="12" font-weight="600">Slice B2</text>
<text x="1090.0" y="100.2" text-anchor="middle" font-size="12">steers by OrderPlaced</text>
<text x="1090.0" y="116.2" text-anchor="middle" font-size="12">was blocked</text>
<rect class="box " x="990" y="212" width="200" height="64" rx="3"/>
<text x="1090.0" y="232.2" text-anchor="middle" font-size="12" font-weight="600">Slice B2 cleared</text>
<text x="1090.0" y="248.2" text-anchor="middle" font-size="12">A3 is planned</text>
<text x="1090.0" y="264.2" text-anchor="middle" font-size="12">builds on the schema</text>
<path class="arr " d="M 940,244 L 990,244" marker-end="url(#ah)"/>
<text class="lbl" x="965.0" y="238.0" text-anchor="middle" font-size="11">clears</text>
<path class="arr " d="M 1090,128 L 1090,212" marker-end="url(#ah)"/>
<text class="lbl" x="1098" y="164.0" text-anchor="start" font-size="11">clearance</text>
<rect class="box dash" x="1230" y="64" width="140" height="64" rx="3"/>
<text x="1300.0" y="84.2" text-anchor="middle" font-size="12" font-weight="600">Seeds tests</text>
<text x="1300.0" y="100.2" text-anchor="middle" font-size="12">from synthetic</text>
<text x="1300.0" y="116.2" text-anchor="middle" font-size="12">OrderPlaced</text>
<path class="arr " d="M 1190,96 L 1230,96" marker-end="url(#ah)"/>
<rect class="box dash" x="1230" y="212" width="140" height="64" rx="3"/>
<text x="1300.0" y="232.2" text-anchor="middle" font-size="12" font-weight="600">Never waits</text>
<text x="1300.0" y="248.2" text-anchor="middle" font-size="12">for A3 to merge</text>
<text x="1300.0" y="264.2" text-anchor="middle" font-size="12">or demo</text>
<path class="arr " d="M 1190,244 L 1230,244" marker-end="url(#ah)"/>
<text x="700" y="290" text-anchor="middle" font-size="11" class="bandt">if two fairways move one mark: both stop for the host</text>
</svg>