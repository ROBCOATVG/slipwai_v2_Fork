<svg viewBox="0 0 1700 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How a mark set in one fairway clears a slice in another: the captain writes its deck log, the harbourmaster copies the line to the harbour log, the other captain reads it there">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
<marker id="ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahhl"/></marker>
</defs>
<style>
svg{color:#172129;font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.box{fill:#fff;stroke:#73828c;stroke-width:1}.box.hl{fill:#dcecea;stroke:#0f6b6b;stroke-width:1.5}.box.dash{stroke-dasharray:4 3;fill:#f4f6f7}
.band{fill:#eef2f4;stroke:#d7dee2}.bandt{fill:#73828c;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;letter-spacing:.04em}
.bar{fill:#f1e9d2;stroke:#8a6d24}.trunk{fill:#dcecea;stroke:#0f6b6b;stroke-width:1.2}
text{fill:#172129}.lbl{fill:#44525c}.arr{stroke:#172129;stroke-width:1.2;fill:none}.arr.hl{stroke:#0f6b6b;stroke-width:1.6}.arr.dash{stroke-dasharray:4 3}
#ah path{fill:#172129}.ahhl{fill:#0f6b6b}
</style>
<rect class="band" x="16" y="16" width="560" height="300" rx="4"/><text class="bandt" x="28" y="33" font-size="11">FAIRWAY · Ordering · berth ord</text>
<rect class="box " x="30" y="64" width="180" height="64" rx="3"/>
<text x="120.0" y="84.2" text-anchor="middle" font-size="12" font-weight="600">Slice A3 (planned)</text>
<text x="120.0" y="100.2" text-anchor="middle" font-size="12">sets OrderPlaced</text>
<text x="120.0" y="116.2" text-anchor="middle" font-size="12">attributes typed</text>
<rect class="box " x="260" y="64" width="200" height="64" rx="3"/>
<text x="360.0" y="84.2" text-anchor="middle" font-size="12" font-weight="600">one file per event</text>
<text x="360.0" y="100.2" text-anchor="middle" font-size="12">(standard: contracts/)</text>
<text x="360.0" y="116.2" text-anchor="middle" font-size="12">set, never moved</text>
<path class="arr " d="M 210,96 L 260,96" marker-end="url(#ah)"/>
<text class="lbl" x="235.0" y="90.0" text-anchor="middle" font-size="11">adds</text>
<rect class="box " x="30" y="212" width="180" height="64" rx="3"/>
<text x="120.0" y="232.2" text-anchor="middle" font-size="12" font-weight="600">Captain A</text>
<text x="120.0" y="248.2" text-anchor="middle" font-size="12">appends mark-set</text>
<text x="120.0" y="264.2" text-anchor="middle" font-size="12">to its own deck log</text>
<path class="arr " d="M 120,128 L 120,212" marker-end="url(#ah)"/>
<text class="lbl" x="128" y="164.0" text-anchor="start" font-size="11">its first stage</text>
<text x="820" y="34" font-size="11" class="bandt" text-anchor="middle">SHARED · synced through refs/slipwai/logs, never through trunk</text>
<rect class="box " x="700" y="50" width="240" height="56" rx="3"/>
<text x="820.0" y="74.2" text-anchor="middle" font-size="12" font-weight="600">Deck log · Ordering</text>
<text x="820.0" y="90.2" text-anchor="middle" font-size="12">mark-set OrderPlaced · by A3</text>
<rect class="box hl" x="700" y="142" width="240" height="56" rx="3"/>
<text x="820.0" y="166.2" text-anchor="middle" font-size="12" font-weight="600">Harbourmaster</text>
<text x="820.0" y="182.2" text-anchor="middle" font-size="12">the only writer of the harbour log</text>
<rect class="box hl" x="700" y="234" width="240" height="70" rx="3"/>
<text x="820.0" y="257.2" text-anchor="middle" font-size="12" font-weight="600">Harbour log</text>
<text x="820.0" y="273.2" text-anchor="middle" font-size="12">mark-set OrderPlaced</text>
<text x="820.0" y="289.2" text-anchor="middle" font-size="12">set by A3 · schema v1 · commit</text>
<path class="arr " d="M 210,244 L 640,244 L 640,78 L 700,78" marker-end="url(#ah)"/>
<text class="lbl" x="430" y="238" text-anchor="middle" font-size="11">appends</text>
<path class="arr " d="M 820,106 L 820,142" marker-end="url(#ah)"/>
<text class="lbl" x="828" y="128" text-anchor="start" font-size="11">reads after each fetch</text>
<path class="arr hl " d="M 820,198 L 820,234" marker-end="url(#ah-hl)"/>
<text class="lbl" x="828" y="220" text-anchor="start" font-size="11">copies the line across</text>
<rect class="band" x="1080" y="16" width="604" height="300" rx="4"/><text class="bandt" x="1092" y="33" font-size="11">FAIRWAY · Billing · berth bil</text>
<rect class="box " x="1100" y="212" width="180" height="64" rx="3"/>
<text x="1190.0" y="232.2" text-anchor="middle" font-size="12" font-weight="600">Captain B</text>
<text x="1190.0" y="248.2" text-anchor="middle" font-size="12">re-derives clearance</text>
<text x="1190.0" y="264.2" text-anchor="middle" font-size="12">at next boundary</text>
<path class="arr hl " d="M 940,269 L 1020,269 L 1020,244 L 1100,244" marker-end="url(#ah-hl)"/>
<text class="lbl" x="980" y="238" text-anchor="middle" font-size="11">reads</text>
<rect class="box " x="1310" y="64" width="200" height="64" rx="3"/>
<text x="1410.0" y="84.2" text-anchor="middle" font-size="12" font-weight="600">Slice B2</text>
<text x="1410.0" y="100.2" text-anchor="middle" font-size="12">steers by OrderPlaced</text>
<text x="1410.0" y="116.2" text-anchor="middle" font-size="12">was blocked</text>
<rect class="box " x="1310" y="212" width="200" height="64" rx="3"/>
<text x="1410.0" y="232.2" text-anchor="middle" font-size="12" font-weight="600">Slice B2 cleared</text>
<text x="1410.0" y="248.2" text-anchor="middle" font-size="12">A3 is planned</text>
<text x="1410.0" y="264.2" text-anchor="middle" font-size="12">builds on the schema</text>
<path class="arr " d="M 1280,244 L 1310,244" marker-end="url(#ah)"/>
<path class="arr " d="M 1410,128 L 1410,212" marker-end="url(#ah)"/>
<text class="lbl" x="1418" y="164.0" text-anchor="start" font-size="11">clearance</text>
<rect class="box dash" x="1540" y="64" width="130" height="64" rx="3"/>
<text x="1605.0" y="84.2" text-anchor="middle" font-size="12" font-weight="600">Seeds tests</text>
<text x="1605.0" y="100.2" text-anchor="middle" font-size="12">from synthetic</text>
<text x="1605.0" y="116.2" text-anchor="middle" font-size="12">OrderPlaced</text>
<path class="arr " d="M 1510,96 L 1540,96" marker-end="url(#ah)"/>
<rect class="box dash" x="1540" y="212" width="130" height="64" rx="3"/>
<text x="1605.0" y="232.2" text-anchor="middle" font-size="12" font-weight="600">Never waits</text>
<text x="1605.0" y="248.2" text-anchor="middle" font-size="12">for A3 to merge</text>
<text x="1605.0" y="264.2" text-anchor="middle" font-size="12">or demo</text>
<path class="arr " d="M 1510,244 L 1540,244" marker-end="url(#ah)"/>
<text x="820" y="336" text-anchor="middle" font-size="11" class="bandt">if two fairways move one mark: a real conflict, and both stop for the host</text>
</svg>